spring.application.name=personal-finance-tracker
server.port=${SERVER_PORT:8080}
spring.config.import=optional:file:./backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finance_tracker?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}

app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.cookie-secure=${COOKIE_SECURE:false}
app.mail.from=${MAIL_FROM:}
app.auth.otp.expiration=${OTP_EXPIRATION:10m}
app.auth.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.auth.otp.resend-cooldown=${OTP_RESEND_COOLDOWN:1m}
app.auth.otp.max-per-hour=${OTP_MAX_PER_HOUR:5}
app.auth.reset-grant.expiration=${RESET_GRANT_EXPIRATION:15m}
app.recurring.fixed-delay-ms=${RECURRING_FIXED_DELAY_MS:60000}
app.recurring.batch-size=${RECURRING_BATCH_SIZE:100}
app.recurring.enabled=${RECURRING_ENABLED:true}
app.notifications.fixed-delay-ms=${NOTIFICATION_FIXED_DELAY_MS:60000}
